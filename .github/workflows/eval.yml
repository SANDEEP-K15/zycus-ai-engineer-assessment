name: Evaluation

on:
  push:
  pull_request:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python scripts/run_eval.py
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval_report.json
